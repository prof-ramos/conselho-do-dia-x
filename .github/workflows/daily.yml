name: Conselho do dia

on:
  schedule:
    - cron: '3 11 * * *'
  push:
    branches: [main]
    paths: ['*.py', 'tests/**', 'requirements-render.txt', '.github/workflows/daily.yml']
  pull_request:
    paths:
      - '.github/workflows/daily.yml'
      - '*.py'
      - 'conselhos.json'
      - 'tests/**'
      - 'requirements-render.txt'

permissions:
  contents: read

concurrency:
  group: conselho-do-dia
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  daily:
    needs: tests
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Select mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          REF: ${{ github.ref }}
        run: |
          mode=dry-run
          if [[ "$EVENT" == schedule && "$PUBLISH_ENABLED" == true ]]; then
            mode=publish
          fi
          if [[ "$mode" == publish && "$REF" != refs/heads/main ]]; then
            echo 'Publicação permitida somente em main' >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          # Refresh main after the concurrency queue: event SHA may precede another post.
          ref: ${{ steps.mode.outputs.mode == 'publish' && 'main' || github.ref }}

      - name: Check pending attempt and same-day guard
        id: state
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          python3 - <<'PY'
          from datetime import datetime
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path('estado.json')
          raw = path.read_bytes() if path.exists() else None
          state = json.loads(raw) if raw is not None else {}
          if os.environ['MODE'] == 'publish' and Path('publication.pending.json').exists():
              raise SystemExit('Tentativa pendente: conferir o X e reconciliar antes de repetir.')
          today = datetime.now(ZoneInfo('America/Sao_Paulo')).date().isoformat()
          skip = os.environ['MODE'] == 'publish' and state.get('data_ultimo_envio') == today
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"skip={str(skip).lower()}\n")
          if skip:
              Path('summary.json').write_text(json.dumps({
                  'ok': True, 'mode': 'publish', 'skipped': True,
                  'reason': 'Já publicado hoje.', 'data': today,
              }, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Checkout serif-sh
        if: steps.state.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: prof-ramos/serif-sh
          ref: abc59e082e476385326f7a7e840f08965f9e6f00
          path: serif-sh
          ssh-key: ${{ secrets.SERIF_SH_DEPLOY_KEY }}
          persist-credentials: false

      - name: Setup Node.js
        if: steps.state.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ hashFiles('serif-sh/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: serif-sh/package-lock.json

      - name: Install app dependencies
        if: steps.state.outputs.skip != 'true'
        working-directory: serif-sh
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Python
        if: steps.state.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rendering dependencies
        if: steps.state.outputs.skip != 'true'
        run: |
          pip install -r requirements-render.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por

      - name: Install and verify Playfair Display
        if: steps.state.outputs.skip != 'true'
        run: |
          mkdir -p ~/.local/share/fonts
          cp fonts/playfair-display/*.ttf ~/.local/share/fonts/
          fc-cache -f
          fc-list | grep -i 'Playfair Display'

      - name: Start app and wait for readiness
        if: steps.state.outputs.skip != 'true'
        run: |
          (cd serif-sh && npm run dev -- --port 5173 --host 127.0.0.1 > ../serif.log 2>&1 &)
          deadline=$((SECONDS + 120))
          until curl --fail --silent --max-time 2 http://127.0.0.1:5173/ > /dev/null; do
            if (( SECONDS >= deadline )); then
              echo 'serif-sh did not become ready within 120 seconds' >&2
              exit 1
            fi
            sleep 1
          done

      - name: Persist intent before publishing
        id: intent
        if: steps.mode.outputs.mode == 'publish' && steps.state.outputs.skip != 'true'
        run: |
          python daily.py --prepare > preparation.json
          python ci_state.py 'preparar tentativa de publicação'
          attempt=$(python -c 'import json; print(json.load(open("preparation.json"))["attempt"])')
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"

      - name: Run daily routine
        id: routine
        if: steps.state.outputs.skip != 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          ATTEMPT: ${{ steps.intent.outputs.attempt }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          args=("--$MODE")
          if [[ "$MODE" == publish ]]; then
            args+=(--prepared-attempt "$ATTEMPT")
          fi
          python daily.py "${args[@]}" > summary.json

      - name: Print and append JSON summary
        if: always()
        run: |
          if [[ -s summary.json ]]; then
            cat summary.json
            {
              echo '```json'
              cat summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve publication state even after failure
        if: always() && steps.intent.outcome == 'success'
        run: python ci_state.py 'persistir resultado da tentativa'

      - name: Upload recovery evidence
        if: always() && steps.mode.outputs.mode == 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: publication-recovery
          path: |
            publication.pending.json
            preparation.json
            summary.json
            estado.json
            log.jsonl
          if-no-files-found: warn

      - name: Upload PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conselho-png
          path: out/*.png
          if-no-files-found: warn

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serif-log
          path: serif.log
          if-no-files-found: warn
