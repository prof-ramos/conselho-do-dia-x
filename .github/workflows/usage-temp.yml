name: Temporary X usage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage:
    runs-on: ubuntu-latest
    steps:
      - name: Read X usage
        shell: bash
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
        run: |
          set +x
          set -euo pipefail

          TOKEN_FILE=$(mktemp)
          USAGE_FILE=''
          trap 'rm -f -- "$TOKEN_FILE"; if [[ -n "$USAGE_FILE" ]]; then rm -f -- "$USAGE_FILE"; fi' EXIT
          USAGE_FILE=$(mktemp)

          HTTP_STATUS=$(curl -s -u "$X_CONSUMER_KEY:$X_CONSUMER_SECRET" \
            -X POST 'https://api.x.com/oauth2/token' \
            --data 'grant_type=client_credentials' \
            -o "$TOKEN_FILE" -w '%{http_code}') || HTTP_STATUS=000
          TOKEN=$(jq -er '.access_token | select(type == "string" and length > 0)' "$TOKEN_FILE" 2>/dev/null) || TOKEN=''
          if [[ -z "$TOKEN" ]]; then
            printf '%s\n' "HTTP status: $HTTP_STATUS" 'falha ao obter token'
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          HTTP_STATUS=$(curl -s \
            -H "Authorization: Bearer $TOKEN" \
            'https://api.x.com/2/usage/tweets?days=30&usage.fields=cap_reset_day,daily_project_usage,daily_client_app_usage,project_cap,project_id,project_usage' \
            -o "$USAGE_FILE" -w '%{http_code}') || HTTP_STATUS=000
          printf 'HTTP status: %s\n' "$HTTP_STATUS"

          if [[ "$HTTP_STATUS" != 200 ]]; then
            HTTP_STATUS=$(curl -s \
              -H "Authorization: Bearer $TOKEN" \
              'https://api.x.com/2/usage/tweets?days=30' \
              -o "$USAGE_FILE" -w '%{http_code}') || HTTP_STATUS=000
            printf 'HTTP status: %s\n' "$HTTP_STATUS"
          fi

          if [[ "$HTTP_STATUS" == 200 ]]; then
            jq '{data: (.data | {
              project_id,
              project_cap,
              project_usage,
              cap_reset_day,
              daily_project_usage: [.daily_project_usage? | if type == "array" then .[] else . end | objects | {
                usage: [.usage[]? | {date, usage}]
              }],
              daily_client_app_usage: [.daily_client_app_usage? | if type == "array" then .[] else . end | objects | {
                client_app_id,
                usage: [.usage[]? | {date, usage}]
              }]
            })}' "$USAGE_FILE"
          else
            jq --arg token "$TOKEN" '{title, detail, type, status,
              errors: [.errors[]? | {message}]
            } | walk(if type == "string" then split($token) | join("[REDACTED]") else . end)' \
              "$USAGE_FILE" 2>/dev/null
            exit 1
          fi
